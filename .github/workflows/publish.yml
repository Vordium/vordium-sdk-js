name: publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: The tag names the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      # npm Trusted Publishing: npm logs in with this job's GitHub OIDC token (id-token: write, environment npm).
      # No npm token is stored anywhere. Provenance is attached automatically (publishConfig.provenance).
      - run: npm publish --access public
